<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Application</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Login View -->
    <div id="login-view" class="view">
      <main>
        <h1>Login</h1>
        
        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              data-test-id="username"
              autocomplete="username"
              required
              aria-required="true"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              data-test-id="password"
              autocomplete="current-password"
              required
              aria-required="true"
            />
          </div>

          <button type="submit" data-test-id="login-button">Login</button>
          
          <!-- Error message positioned below Login button (FR-008) -->
          <div 
            id="error-message" 
            class="error-message" 
            role="alert" 
            aria-live="polite"
            data-test-id="error-message"
            style="display: none;"
          ></div>
        </form>
      </main>
    </div>

    <!-- Authenticated View (after successful login) -->
    <div id="authenticated-view" class="view" style="display: none;">
      <main>
        <h1>Welcome!</h1>
        <p data-test-id="welcome-message">You have successfully logged in as <strong>admin</strong>.</p>
        <button id="logout-button" data-test-id="logout-button">Logout</button>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
